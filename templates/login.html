{% extends 'base.html' %}

{% block content %}
<div class="flex items-center justify-center py-12">
    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-md border border-slate-100">
        <h2 class="text-2xl font-bold text-slate-800 text-center mb-2">Masuk Akun</h2>
        <p class="text-sm text-slate-500 text-center mb-6">Silakan masuk sesuai hak akses Anda</p>

        <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                <input type="text" name="username" required placeholder="Masukkan username"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
            </div>
            <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition shadow">
                Masuk
            </button>
        </form>

        <div class="mt-6 pt-4 border-t text-xs text-slate-500 space-y-1">
            <p class="font-semibold text-slate-600">Akun Demo Default:</p>
            <p>• Pustakawan: <code class="bg-slate-100 px-1 py-0.5 rounded">admin / admin123</code></p>
            <p>• Peminjam: <code class="bg-slate-100 px-1 py-0.5 rounded">siswa1 / siswa123</code></p>
        </div>
    </div>
</div>
{% endblock %}
